name: Terraform checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: 1.16.1
  TF_VAR_snowflake_org: ${{ secrets.SNOWFLAKE_ORG }}
  TF_VAR_snowflake_account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  TF_VAR_snowflake_user: ${{ secrets.SNOWFLAKE_USER }}
  TF_VAR_snowflake_role: ${{ secrets.SNOWFLAKE_ROLE }}
  TF_VAR_snowflake_private_key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
  # Add the client's state storage login here, e.g. ARM_CLIENT_ID etc. for Azure

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snowflake-terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  plan-dev:
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snowflake-terraform
    steps:
      - uses: actions/checkout@v4
      - id: backend
        name: Check for a state backend
        run: |
          if [ -f backend/dev.hcl ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "No backend/dev.hcl yet, so no plan for dev." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.backend.outputs.ready == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - if: steps.backend.outputs.ready == 'true'
        run: terraform init -backend-config=backend/dev.hcl
      - if: steps.backend.outputs.ready == 'true'
        run: terraform plan -var-file=dev.tfvars -lock-timeout=5m